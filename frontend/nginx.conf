server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API — append trailing slash if missing so FastAPI
    # never needs to issue a 307 redirect (which would expose the
    # internal backend hostname to the browser).
    location ~ ^/api(/.*)?$ {
        # Normalise: ensure there is always a trailing slash on the
        # base collection paths (e.g. /api/v1/departments → /api/v1/departments/)
        rewrite ^(/api/.+[^/])$ $1/ break;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rewrite Location headers back to relative paths if backend
        # still returns a redirect
        proxy_redirect http://backend:8000/ /;
    }

    # Proxy health check
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }
}
